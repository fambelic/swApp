{{- $secretName := default (include "apigateway-service.fullname" .) .Values.gatewaySecret.name -}}
{{- $encryptedData := .Values.gatewaySecret.encryptedData | default dict -}}
{{- $jwtEncrypted := get $encryptedData .Values.gatewaySecret.jwtSecretKey -}}
{{- if or .Values.gatewaySecret.sealedSecret.enabled $jwtEncrypted }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "apigateway-service.labels" . | nindent 4 }}
spec:
  encryptedData:
    {{ .Values.gatewaySecret.jwtSecretKey }}: {{ required "apigateway-service: gatewaySecret.encryptedData.<jwtSecretKey> is required when rendering a SealedSecret" $jwtEncrypted }}
  template:
    metadata:
      name: {{ $secretName }}
      labels:
        {{- include "apigateway-service.labels" . | nindent 8 }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "apigateway-service.labels" . | nindent 4 }}
stringData:
  {{ .Values.gatewaySecret.jwtSecretKey }}: {{ .Values.gatewaySecret.jwtSecretValue | quote }}
{{- end }}
