{{- $secretName := default (include "db-service.fullname" .) .Values.auth.secretName -}}
{{- $encryptedData := .Values.auth.encryptedData | default dict -}}
{{- $hasEncryptedData := and (hasKey $encryptedData "user") (hasKey $encryptedData "password") (hasKey $encryptedData "db") -}}
{{- if or .Values.auth.sealedSecret.enabled $hasEncryptedData }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "db-service.labels" . | nindent 4 }}
spec:
  encryptedData:
    user: {{ required "db-service: auth.encryptedData.user is required when rendering a SealedSecret" (get $encryptedData "user") }}
    password: {{ required "db-service: auth.encryptedData.password is required when rendering a SealedSecret" (get $encryptedData "password") }}
    db: {{ required "db-service: auth.encryptedData.db is required when rendering a SealedSecret" (get $encryptedData "db") }}
  template:
    metadata:
      name: {{ $secretName }}
      labels:
        {{- include "db-service.labels" . | nindent 8 }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "db-service.labels" . | nindent 4 }}
stringData:
  user: {{ .Values.auth.username | quote }}
  password: {{ .Values.auth.password | quote }}
  db: {{ .Values.auth.database | quote }}
{{- end }}
