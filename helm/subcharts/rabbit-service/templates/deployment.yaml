apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rabbit-service.fullname" . }}
  labels:
    {{- include "rabbit-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "rabbit-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rabbit-service.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ include "rabbit-service.appName" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: rabbitmq
              containerPort: {{ .Values.service.rabbitmqPort }}
              protocol: TCP
            - name: management
              containerPort: {{ .Values.service.managementPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
