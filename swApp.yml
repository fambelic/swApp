# Source: swapp/charts/swapp-db/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: swapp-swapp-db
  labels:
    helm.sh/chart: swapp-db-0.1.0
    app.kubernetes.io/name: swapp-db
    app.kubernetes.io/instance: swapp
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: swapp-db
      app.kubernetes.io/instance: swapp
  serviceName: swappdb
  replicas: 1 # by default is 1
  template:
    metadata:
      labels:
        helm.sh/chart: swapp-db-0.1.0
        app.kubernetes.io/name: swapp-db
        app.kubernetes.io/instance: swapp
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      containers:
        - name: swapp-db
          image: "mongo:4.0.28"
          ports:
            - containerPort: 27017
              name: http
          volumeMounts:
            - name: mongodata
              mountPath: /data/db
            - name: mongodata
              mountPath: /data/configdb
          env:
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                secretKeyRef:
                  key: db
                  name: swapp-swapp-db
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  key: user
                  name: swapp-swapp-db
                  optional: false
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: swapp-swapp-db
                  optional: false
  volumeClaimTemplates:
    - metadata:
        name: mongodata
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "csi-cinder-fast"
        resources:
          requests:
            storage: 1Gi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations: {}
  name: teacher-3-https-route
  namespace: teacher-3
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared-gateway
      namespace: default
      sectionName: https
  rules:
    # ── Rule 1: /teacher-3/gateway → API Gateway service ─────────────────────
    # Must be listed BEFORE the broader /teacher-3 prefix rule so it is
    # evaluated first (Gateway API evaluates rules in order).
    - matches:
        - path:
            type: PathPrefix
            value: /teacher-3/gateway
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              replacePrefixMatch: /
              type: ReplacePrefixMatch
      backendRefs:
        - group: ""
          kind: Service
          name: swapp-swapp-gateway
          port:
          weight: 1

    # ── Rule 2: /teacher-3 → Frontend service ────────────────────────────────
    - matches:
        - path:
            type: PathPrefix
            value: /teacher-3
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              replacePrefixMatch: /
              type: ReplacePrefixMatch
      backendRefs:
        - group: ""
          kind: Service
          name: swapp-swapp-frontend
          port:
          weight: 1
