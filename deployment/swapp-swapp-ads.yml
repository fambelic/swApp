# Source: swapp/charts/swapp-ads/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swapp-swapp-ads
  labels:
    helm.sh/chart: swapp-ads-0.1.0
    app.kubernetes.io/name: swapp-ads
    app.kubernetes.io/instance: swapp
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: swapp-ads
      app.kubernetes.io/instance: swapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swapp-ads
        app.kubernetes.io/instance: swapp
    spec:
      securityContext:
        {}
      containers:
        - name: swapp-ads
          securityContext:
            {}
          image: mascorra/swapp-ads:v6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          env:
            - name: SPRING_DATA_MONGODB_HOST
              valueFrom:
                configMapKeyRef:
                  key: mongoHost
                  name: swapp-swapp-ads
                  optional: false
            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  key: rabbitHost
                  name: swapp-swapp-ads
                  optional: false
            - name: SPRING_DATA_MONGODB_USERNAME
              valueFrom:
                secretKeyRef:
                  key: user
                  name: swapp-swapp-db
                  optional: false
            - name: SPRING_DATA_MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: swapp-swapp-db
                  optional: false
          resources:
            {}

