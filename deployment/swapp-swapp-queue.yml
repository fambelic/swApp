# Source: swapp/charts/swapp-queue/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swapp-swapp-queue
  labels:
    helm.sh/chart: swapp-queue-0.1.0
    app.kubernetes.io/name: swapp-queue
    app.kubernetes.io/instance: swapp
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: swapp-queue
      app.kubernetes.io/instance: swapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swapp-queue
        app.kubernetes.io/instance: swapp
    spec:
      securityContext:
        {}
      containers:
        - name: swapp-queue
          securityContext:
            {}
          image: "rabbitmq:management"
          imagePullPolicy: IfNotPresent
          ports:
            - name: rabbitmq
              containerPort: 5672
              protocol: TCP
            - name: management
              containerPort: 15672
              protocol: TCP
          resources:
            {}

