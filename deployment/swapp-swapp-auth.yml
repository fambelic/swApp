# Source: swapp/charts/swapp-auth/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swapp-swapp-auth
  labels:
    helm.sh/chart: swapp-auth-0.1.0
    app.kubernetes.io/name: swapp-auth
    app.kubernetes.io/instance: swapp
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: swapp-auth
      app.kubernetes.io/instance: swapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swapp-auth
        app.kubernetes.io/instance: swapp
    spec:
      securityContext:
        {}
      containers:
        - name: swapp-auth
          securityContext:
            {}
          image:
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort:
              protocol: TCP
          resources:
            {}
          env:
            - name: SPRING_DATA_MONGODB_HOST
              value: swapp-swapp-db
            - name: SPRING_DATA_MONGODB_USERNAME
              valueFrom:
                secretKeyRef:
                  key: user
                  name: swapp-swapp-db
                  optional: false
            - name: SPRING_DATA_MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: swapp-swapp-db
                  optional: false

