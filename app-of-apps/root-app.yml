apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: swapp-root
  namespace: teacher-3
  labels:
    app.kubernetes.io/part-of: swapp
spec:
  project: swapp
  source:
    repoURL: https://github.com/fambelic/swApp.git
    targetRevision: iac
    path: app-of-apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: teacher-3
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true